# Builds the app and runs the self-check on pushes to main, or by hand (Actions → build → Run workflow).
# macOS minutes count ten times against the monthly allowance, so other branches, changes to the docs alone, and runs
# overtaken by a newer push are skipped.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'Tools/eval/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        # The toolbar code needs the macOS 26 SDK: use the newest Xcode 26 on the runner.
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Self-check
        run: ./build.sh test
      - name: Build
        run: swift build -c release --product Waffle
      - name: Speech models cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/FluidAudio
          key: fluidaudio-models-0.17.4-ultra-v3
      - name: Check with the real models
        # Speech made with macOS's voices in several languages and rates, recognized whole, live through the windows, and as the pass
        # after a call. Slow on CI (no Neural Engine), so it runs once the build is green.
        run: swift run -c release WaffleCheck
        timeout-minutes: 40
